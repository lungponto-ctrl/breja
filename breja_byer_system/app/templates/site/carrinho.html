<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breja Byer - Carrinho e Finalização</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <nav class="bg-black border-b border-yellow-500/30 p-4 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🍺</span>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-yellow-400">BREJA BYER</h1>
                    <span class="text-[10px] text-zinc-400 tracking-widest uppercase block">Revisão do Pedido</span>
                </div>
            </div>
            <a href="/" class="text-xs text-yellow-400 hover:underline font-semibold">← Voltar para a Vitrine</a>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container mx-auto p-6 max-w-2xl flex-grow space-y-6">
        <div class="bg-zinc-900 border border-yellow-500/30 rounded-2xl p-6 shadow-xl space-y-6">
            <h2 class="text-2xl font-black text-yellow-400">Seu Pedido de Bebidas 🛒</h2>

            <!-- Tabela / Lista de Itens -->
            <div id="carrinhoLista" class="space-y-3 divide-y divide-zinc-800">
                <!-- Preenchido via JavaScript -->
            </div>

            <div class="pt-4 border-t border-zinc-800 flex justify-between items-center text-xl font-black">
                <span class="text-zinc-400">Total a Pagar:</span>
                <span id="carrinhoTotal" class="text-yellow-400">R$ 0.00</span>
            </div>

            <!-- Formulário de Envio -->
            <form action="/fazer-pedido" method="POST" onsubmit="return prepararEnvio(event)" class="space-y-4 pt-4 border-t border-zinc-800">
                <input type="hidden" name="itens_resumo" id="formItensResumo">
                <input type="hidden" name="valor_total" id="formValorTotal">

                <div>
                    <label class="block text-xs text-zinc-400 mb-1 font-semibold">Seu Nome *</label>
                    <input type="text" name="cliente_nome" id="clienteNome" required placeholder="Ex: João Silva" class="w-full bg-zinc-950 border border-yellow-500/30 rounded-xl p-3 text-sm text-zinc-100 focus:border-yellow-400 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs text-zinc-400 mb-1 font-semibold">WhatsApp / Telefone *</label>
                    <input type="tel" name="cliente_telefone" id="clienteTelefone" required placeholder="Ex: (31) 99999-9999" class="w-full bg-zinc-950 border border-yellow-500/30 rounded-xl p-3 text-sm text-zinc-100 focus:border-yellow-400 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-black py-3.5 rounded-xl transition shadow-lg text-sm uppercase tracking-wider">
                    Confirmar e Enviar Pedido 🚀
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-black border-t border-yellow-500/20 p-4 text-center text-zinc-500 text-xs">
        &copy; 2026 Breja Byer - Carrinho.
    </footer>

    <script>
        // Lógica simples para ler o localStorage caso use carrinho separado
        // (Nota: na nossa vitrine atual, o carrinho roda direto no drawer lateral da index.html)
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("carrinhoLista");
            container.innerHTML = `<p class="text-zinc-500 text-sm text-center py-6">Utilize o painel lateral da vitrine principal para gerir os seus itens em tempo real.</p>`;
        });

        function prepararEnvio(e) {
            return true;
        }
    </script>
</body>
</html>
